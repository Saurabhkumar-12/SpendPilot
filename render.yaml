services:
  - type: web
    name: spendpilot-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: saurabhkumarr8058@gmail.com
      - key: APP_URL
        value: https://spendpilot-coral.vercel.app
      - key: CORS_ORIGIN
        value: https://spendpilot-coral.vercel.app
